# AlphaAI preview + durable PostgreSQL.
# The web service remains on Render Free. PostgreSQL uses the approved
# basic-256mb plan (currently listed at $6/month); review Render's sync
# estimate before applying. No other paid resources are defined here.
databases:
  - name: alphaai-db
    databaseName: alphaai
    user: alphaai
    plan: free
    region: frankfurt
    ipAllowList: []
    storageAutoscalingEnabled: false

services:
  - type: web
    name: alphaai-preview
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /ready
    autoDeployTrigger: off
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: AlphaAI
      - key: DATABASE_URL
        fromDatabase:
          name: alphaai-db
          property: connectionString
      - key: ALPHAAI_SECRET_KEY
        generateValue: true
