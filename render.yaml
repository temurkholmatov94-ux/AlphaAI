# Preview-only deployment. This creates one free web service and no paid database.
# SQLite is intentionally used only for a disposable visual preview; its filesystem
# is ephemeral on free web services. Do not use this configuration for real users.
services:
  - type: web
    name: alphaai-preview
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /ready
    autoDeployTrigger: off
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: AlphaAI
      - key: DATABASE_URL
        value: sqlite:///./alphaai-preview.db
      - key: ALPHAAI_SECRET_KEY
        generateValue: true
      - key: ALPHAAI_ADMIN_EMAILS
        sync: false
