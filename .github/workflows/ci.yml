name: AlphaAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply database migrations
        env:
          PYTHONPATH: .
        run: alembic upgrade head
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Validate worker agent syntax
        run: cd .. && python -m py_compile worker-agent/agent.py
      - name: Test worker agent
        run: cd ../worker-agent && python -m unittest -v
      - name: Build API container
        run: docker build -t alphaai-api .
